name: Build and Release Vapor

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Swift
        run: |
          swift --version
          uname -m

      - name: Build Vapor GUI & DMG Package
        run: |
          chmod +x scripts/*.sh bin/vapor
          ./scripts/build_dmg.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Vapor-macOS-AppleSilicon.dmg
          name: "Vapor Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
